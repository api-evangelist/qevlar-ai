aid: qevlar-ai
name: Qevlar AI
description: >-
  Qevlar AI is an autonomous Security Operations Center (SOC) platform that
  investigates every security alert the way a top analyst would — without
  playbooks, without hallucinations, and without adding headcount. Founded in
  2023 by Ahmed Achchak and Hamza Sayah and headquartered in Paris, France, the
  company runs a proprietary graph-based AI orchestrator (not an LLM agent) that
  delivers deterministic, evidence-based investigations across the full security
  stack. As soon as an alert fires from SIEM/EDR tools, Qevlar autonomously
  pulls, enriches, and analyzes internal and external data, then returns a
  conclusive malicious/benign verdict, a full investigation report, and
  recommended remediation — typically in under three minutes, closing up to 80%
  of tickets automatically. The SaaS platform is SOC 2 Type 2 certified, hosted
  in the EU (Belgium) on GCP, and connects via API to 50+ security tools
  (Microsoft Sentinel, Splunk, CrowdStrike, Cortex, Google SecOps, and more). It
  is trusted by Fortune Global 500 enterprises and leading MSSPs/MDRs across
  Europe and the US. Backed by EQT Ventures and Partech.
